# Render.com deployment configuration
# https://render.com/docs/deploy-node-express-app

services:
  - type: web
    name: vachana-sanchaya
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: RAG_WARM_INDEX
        value: 0
      - key: RAG_USE_PREBUILT_INDEX
        value: 1
      - key: EMBEDDING_MODE
        value: local
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: models/gemini-flash-latest
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LLM_PROVIDER
        value: auto
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: theAshutosh369/MahapashupataVeershaivism
      - key: GITHUB_BRANCH
        value: main
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: rag-index
      - key: SUPABASE_INDEX_PREFIX
        value: ""
    healthCheckPath: /api/rag/status
    autoDeploy: false
